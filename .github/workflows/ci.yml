# FoodMe CI: runs on every pull request to main.
#
# Jobs: unit tests, integration tests, e2e tests (Playwright), Qodana static analysis.
# The final `ci-passed` job depends on all of them and is the single status check
# to mark as "required" in the main branch ruleset, so a red pipeline blocks the merge.
#
# Secrets: QODANA_TOKEN (project token from https://qodana.cloud).

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Backend unit tests (JUnit + Mockito)
        working-directory: apps/backend
        run: ./gradlew unitTest --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/admin/package-lock.json

      # Vitest isn't set up yet; `--if-present` makes these no-ops until a
      # "test" script is added to each package.json (see the unit-tests skill).
      - name: Storefront unit tests (Vitest)
        working-directory: apps/web
        run: |
          npm ci
          npm run test --if-present

      - name: Admin unit tests (Vitest)
        working-directory: apps/admin
        run: |
          npm ci
          npm run test --if-present

      - name: Upload backend unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: apps/backend/build/reports/tests/unitTest/
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # @SpringBootTest + MockMvc / @DataJpaTest on H2 (profile "test"), no Postgres needed.
      - name: Backend integration tests
        working-directory: apps/backend
        run: ./gradlew integrationTest --no-daemon

      - name: Upload integration test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: apps/backend/build/reports/tests/integrationTest/
          if-no-files-found: ignore

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodme
          POSTGRES_USER: foodme
          POSTGRES_PASSWORD: foodme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The production image bundles both SPAs, so the backend also serves
      # /backoffice, which happy-path.spec.ts needs (a plain bootRun doesn't).
      - name: Build app image
        run: docker build -f apps/backend/Dockerfile -t foodme:ci .

      - name: Start backend on :8081
        run: |
          docker run -d --name foodme --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 \
            -e DB_NAME=foodme -e DB_USER=foodme -e DB_PASSWORD=foodme \
            foodme:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health | grep -q '"UP"'; then
              echo "Backend is up"; exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy"; docker logs foodme; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/admin/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/admin

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Playwright starts each Vite dev server itself (webServer in playwright.config.ts).
      - name: Storefront e2e
        id: web-e2e
        working-directory: apps/web
        run: npm run test:e2e

      - name: Admin e2e
        if: ${{ !cancelled() }}
        working-directory: apps/admin
        run: npm run test:e2e

      - name: Backend logs
        if: ${{ failure() }}
        run: docker logs foodme

      - name: Upload Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/admin/playwright-report/
            apps/admin/test-results/
          if-no-files-found: ignore
          retention-days: 14

  static-analysis:
    name: Static analysis (Qodana)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PR mode: analyse the PR head and compare against its base commit.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana scan
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          # Config (linter, fail threshold) lives in qodana.yaml at the repo root.
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

  # Single required check for branch protection: green only if every job passed.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [unit-tests, integration-tests, e2e-tests, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more CI jobs did not succeed"; exit 1
          fi
